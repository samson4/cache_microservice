[project]
name = "payload-cache-service"
version = "0.1.0"
description = "A simple caching service implementation in FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
cache-cli = "app.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"
